[project]
name = "bluecart-ecommerce"
version = "1.0.0"
description = "BlueCart — Django онлайн дэлгүүр"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.3",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "vercel>=0.13",
    "tzdata",
]

[tool.vercel]
entrypoint = "ecommerce.wsgi:application"

[tool.vercel.scripts]
# Vercel build үед: migrate → каталог ачаалах → зургийг Blob руу хуулах
build = "python build.py"
