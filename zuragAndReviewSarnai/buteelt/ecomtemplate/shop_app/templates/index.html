{% extends 'base.html' %} {% load static %} {% block content %}

<!-- ========================= SECTION MAIN ========================= -->
<section class="section-intro padding-y-sm">
  <div class="container">
    <div class="intro-banner-wrap">
      <img
        src="{% static 'images/banners/1.jpg' %}"
        class="img-fluid rounded"
      />
    </div>
  </div>
</section>
<!-- ========================= SECTION MAIN END// ========================= -->

<!-- ========================= SECTION ========================= -->
<section class="section-name padding-y-sm">
  <div class="container">
    <header class="section-heading">
      <a href="{% url 'store' %}" class="btn btn-outline-primary float-right">
        See all
      </a>
      <h3 class="section-title">Сүүлд нэмэгдсэн бараа</h3>
    </header>

    <div class="row">
      {% for product in latest_products %}
      <div class="col-md-3">
        <div class="card card-product-grid">
          <a href="{{ product.get_url }}" class="img-wrap">
            <img
              src="{{ product.images.url }}"
              alt="{{ product.product_name }}"
              class="img-fluid"
            />
          </a>

          <figcaption class="info-wrap">
            <a href="{{ product.get_url }}" class="title">
              {{ product.product_name }}
            </a>
          {% if product.average_rating %}
    <div class="d-flex align-items-center">

        <div class="rating">
            {% for i in "12345" %}
                {% with current=forloop.counter0 next=forloop.counter %}

                    {# 1. БҮТЭН ОД #}
                    {% if product.average_rating >= next %}
                        <i class="fa-solid fa-star text-warning"></i>

                    {# 2. ХАГАС ОД #}
                    {% elif product.average_rating > current and product.average_rating < next %}
                        <i class="fa-solid fa-star-half-stroke text-warning"></i>

                    {# 3. ХООСОН ОД #}
                    {% else %}
                        <i class="fa-regular fa-star text-warning"></i>
                    {% endif %}

                {% endwith %}
            {% endfor %}
        </div>

        {# ✅ ОДНЫ АРД ДУНДАЖ ГАРНА #}
        <span class="text-muted ms-2">
            {{ product.average_rating|floatformat:1 }}
        </span>

    </div>
{% else %}
    <span class="text-muted">No rating yet</span>
{% endif %}



            <p class="text-muted">{{ product.description }}</p>
            <div class="price mt-1">${{ product.price }}</div>
          </figcaption>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

{% endblock %}
